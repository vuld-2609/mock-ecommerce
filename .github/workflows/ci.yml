name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mock_ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mock_ecommerce?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      PORT: 3000
      SECRET_KEY: test-secret-key
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_SECRET: test-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 7d
      APP_URL: http://localhost:3000
      APP_NAME: Mock Ecommerce
      MAIL_HOST: smtp.example.com
      MAIL_PORT: 587
      MAIL_USER: test@example.com
      MAIL_PASSWORD: test-password
      MAIL_FROM: "No Reply <test@example.com>"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - run: pnpm prisma migrate deploy

      - run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"

      - run: pnpm build

      - run: pnpm test

      - run: pnpm test:e2e
